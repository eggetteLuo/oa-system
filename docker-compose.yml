services:
  postgres:
    image: postgres:16-alpine
    container_name: oa-postgres
    environment:
      POSTGRES_DB: oa_dev
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa_pass
    ports:
      - "5432:5432"
    volumes:
      - oa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U oa -d oa_dev" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oa-redis
    ports:
      - "6379:6379"
    volumes:
      - oa_redisdata:/data
    command: redis-server --appendonly yes # 开启 AOF 持久化
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  oa_pgdata:
  oa_redisdata: